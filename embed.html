<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click With The World — embed</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #12142b;
    --amber: #ffb627;
    --text: #f2f0e6;
    --text-dim: #a7acd9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  /* No card/panel here on purpose — the widget sits directly on whatever
     background the embedding page has. Sizes are driven by vh/vw (the
     iframe's own viewport), so this scales cleanly whether the host sizes
     it 300x150, 400x200, 500x250, or anything else in between. */
  .widget {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 5vw, 20px);
    padding: 6% 5%;
  }

  .counter-button {
    position: relative;
    flex: none;
    width: clamp(50px, 44vh, 130px);
    height: clamp(50px, 44vh, 130px);
    border-radius: 50%;
    border: 1px solid rgba(255,182,39,0.4);
    background:
      radial-gradient(circle at 50% 38%, rgba(255,182,39,0.22), transparent 65%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    padding: 0;
    overflow: visible;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }

  .counter-button:active { transform: scale(0.94); }

  .counter-button:disabled {
    cursor: default;
    opacity: 0.85;
  }

  .counter-button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 4px;
  }

  .counter-button.pulse {
    animation: pulse 0.32s ease;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,182,39,0.55); }
    100% { box-shadow: 0 0 0 16px rgba(255,182,39,0); }
  }

  .count-number {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(12px, 15vh, 34px);
    letter-spacing: 0.3px;
    line-height: 1;
  }

  .tap-hint {
    margin-top: clamp(2px, 1.5vh, 6px);
    font-size: clamp(7px, 5.5vh, 12px);
    color: var(--text-dim);
    line-height: 1;
  }

  .side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(4px, 3vh, 10px);
    min-width: 0;
  }

  .label {
    font-size: clamp(8px, 6vh, 14px);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .attribution {
    font-size: clamp(7px, 4.5vh, 11px);
    color: var(--text-dim);
    text-decoration: none;
    opacity: 0.85;
    white-space: nowrap;
  }

  .attribution:hover { opacity: 1; }

  .particle {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    font-size: clamp(8px, 6vh, 13px);
    color: var(--amber);
    animation: rise 0.7s ease-out forwards;
  }

  @keyframes rise {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy, -40px)) scale(0.8); }
  }

  @media (prefers-reduced-motion: reduce) {
    .counter-button.pulse, .particle { animation: none !important; }
  }
</style>
</head>
<body>

<div class="widget">
  <button id="clickBtn" class="counter-button" aria-label="Add your click to the world count">
    <span id="countDisplay" class="count-number">&mdash;</span>
    <span class="tap-hint">tap to click</span>
  </button>
  <div class="side">
    <span class="label">clicks worldwide</span>
    <a class="attribution" href="https://clickwiththeworld.fun" target="_blank" rel="noopener">
      🌍 clickwiththeworld.fun
    </a>
  </div>
</div>

<script type="module" src="embed-widget.js"></script>

</body>
</html>
