<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click With The World — embed</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #12142b;
    --panel: #1b2044;
    --panel-line: rgba(255,255,255,0.08);
    --amber: #ffb627;
    --text: #f2f0e6;
    --text-dim: #a7acd9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .widget {
    width: 100%;
    height: 100%;
    max-width: 260px;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,182,39,0.14), transparent 70%),
      var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
  }

  .counter-button {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 1px solid rgba(255,182,39,0.35);
    background:
      radial-gradient(circle at 50% 38%, rgba(255,182,39,0.18), transparent 65%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    padding: 0;
    overflow: visible;
    transition: transform 0.08s ease;
  }

  .counter-button:active { transform: scale(0.94); }

  .counter-button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 4px;
  }

  .counter-button.pulse {
    animation: pulse 0.32s ease;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,182,39,0.55); }
    100% { box-shadow: 0 0 0 16px rgba(255,182,39,0); }
  }

  .count-number {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    letter-spacing: 0.3px;
  }

  .tap-hint {
    margin-top: 2px;
    font-size: 9px;
    color: var(--text-dim);
  }

  .particle {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    font-size: 11px;
    color: var(--amber);
    animation: rise 0.7s ease-out forwards;
  }

  @keyframes rise {
    0% { opacity: 1; transform: translate(0, 0); }
    100% { opacity: 0; transform: translate(var(--dx), -40px); }
  }

  .attribution {
    font-size: 10px;
    color: var(--text-dim);
    text-decoration: none;
    opacity: 0.85;
  }

  .attribution:hover { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .counter-button.pulse, .particle { animation: none !important; }
  }
</style>
</head>
<body>

<div class="widget">
  <button id="clickBtn" class="counter-button" aria-label="Add your click to the world count">
    <span id="countDisplay" class="count-number">&mdash;</span>
    <span class="tap-hint">tap to click</span>
  </button>
  <a class="attribution" href="https://click-with-the-world.vercel.app" target="_blank" rel="noopener">
    🌍 Click With The World
  </a>
</div>

<script type="module" src="embed-widget.js"></script>

</body>
</html>
