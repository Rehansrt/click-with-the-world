<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click With The World — embed</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #12142b;
    --amber: #ffb627;
    --text: #f2f0e6;
    --text-dim: #d6daf7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  /* The frame itself stays transparent; the button and its text sit together
     in one dark pill, so the light text is readable whatever colour the host
     page is. Everything is sized from the iframe's own viewport: --d is the
     button diameter, as large as the frame allows on both axes. */
  .widget {
    --d: clamp(56px, min(66vh, 30vw), 240px);
    --pad: clamp(4px, 2.6vh, 10px);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: clamp(8px, 3.4vw, 22px);
    max-width: 100%;
    padding: var(--pad) calc(var(--pad) * 3.5) var(--pad) var(--pad);
    border-radius: 999px;
    background: rgba(18, 20, 43, 0.95);
    border: 1px solid rgba(255, 182, 39, 0.28);
  }

  .counter-button {
    position: relative;
    flex: none;
    width: var(--d);
    height: var(--d);
    border-radius: 50%;
    border: 1px solid rgba(255,182,39,0.4);
    background:
      radial-gradient(circle at 50% 38%, rgba(255,182,39,0.22), transparent 65%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    padding: 0;
    overflow: visible;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }

  .counter-button:active { transform: scale(0.94); }

  .counter-button:disabled {
    cursor: default;
    opacity: 0.85;
  }

  .counter-button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 4px;
  }

  .counter-button.pulse {
    animation: pulse 0.32s ease;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,182,39,0.55); }
    100% { box-shadow: 0 0 0 16px rgba(255,182,39,0); }
  }

  .count-number {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: calc(var(--d) * 0.3);
    letter-spacing: 0.3px;
    line-height: 1;
    white-space: nowrap;
  }

  .tap-hint {
    margin-top: calc(var(--d) * 0.05);
    font-size: clamp(11px, calc(var(--d) * 0.11), 20px);
    color: var(--text-dim);
    line-height: 1;
  }

  .side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(4px, 3vh, 10px);
    min-width: 0;
  }

  .label {
    font-size: clamp(12px, 8.5vh, 26px);
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }

  .attribution {
    font-size: clamp(12px, 7.5vh, 20px);
    color: var(--text-dim);
    text-decoration: none;
    white-space: nowrap;
  }

  .attribution:hover { text-decoration: underline; }

  .particle {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    font-size: clamp(8px, 6vh, 13px);
    color: var(--amber);
    animation: rise 0.7s ease-out forwards;
  }

  @keyframes rise {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy, -40px)) scale(0.8); }
  }

  @media (prefers-reduced-motion: reduce) {
    .counter-button.pulse, .particle { animation: none !important; }
  }
</style>
</head>
<body>

<div class="widget">
  <button id="clickBtn" class="counter-button" aria-label="Add your click to the world count">
    <span id="countDisplay" class="count-number">&mdash;</span>
    <span class="tap-hint">tap to click</span>
  </button>
  <div class="side">
    <span class="label">clicks worldwide</span>
    <a class="attribution" href="https://www.clickwiththeworld.fun" target="_blank" rel="noopener">
      🌍 www.clickwiththeworld.fun
    </a>
  </div>
</div>

<script type="module" src="embed-widget.js"></script>

</body>
</html>
